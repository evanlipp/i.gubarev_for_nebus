services:
  app:
    build:
      context: .
    command: sh ./docker-entrypoint.sh
    init: true
    ports:
      - "3001:3001"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    environment:
      NUXT_TELEMETRY_DISABLED: "1"
    mem_limit: 512m
    cpus: 1.0

volumes:
  node_modules:
